---
name: 'terald-action'
description: 'Report failed and recovered CI builds to a Telegram chat'
branding:
  icon: send
  color: blue
runs:
  using: 'node24'
  main: 'src/terald.js'
inputs:
  token:
    description: 'The token of the Telegram bot'
    required: true
  chat:
    description: 'The ID of the Telegram chat to post messages to'
    required: true
  github-token:
    description: 'The GitHub token that can read workflow runs'
    required: false
    default: ${{ github.token }}
  telegram:
    description: 'The URL of the Telegram Bot API server'
    required: false
    default: https://api.telegram.org
