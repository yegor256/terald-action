---
# yamllint disable rule:line-length
name: test
'on':
  push:
    branches:
      - master
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - if: always()
        uses: ./
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT }}
